<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a0f2e" />
<title>Wink Wink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23ff5c8a'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='26'%3E%F0%9F%98%89%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
<main id="app">
  <section id="phone" class="phone">
    <video id="cam" class="cam" autoplay muted playsinline></video>
    <canvas id="scene" class="scene"></canvas>

    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="score"><b id="score">0</b><span>charm</span></div>
        <div class="combo"><b id="combo">0</b><span>combo</span></div>
        <div class="time"><b id="time">15</b><span>sec</span></div>
      </div>
      <div id="judge" class="judge"></div>
      <div class="eyes"><span id="eyeL" class="eye">L</span><span id="eyeR" class="eye">R</span></div>
    </div>

    <div id="startPanel" class="panel">
      <div class="card gate">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#2a1740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="30" height="24" rx="5"/><path d="M35 20l8-5v18l-8-5"/><circle cx="20" cy="24" r="6"/></svg>
        <h2>Allow the camera</h2>
        <p>Everything stays on your phone.</p>
        <button id="play" class="btn">Open camera</button>
        <button id="practice" class="link">No camera? Tap practice</button>
      </div>
    </div>

    <div id="setupPanel" class="panel hidden">
      <div class="card">
        <div class="kicker" id="setupKicker">CAMERA</div>
        <h2 id="setupTitle">Loading…</h2>
        <p id="setupText">One second.</p>
        <div id="calib" class="calib hidden"></div>
        <button id="startRound" class="btn hidden">Start</button>
        <button id="bothMode" class="link hidden">Use both eyes</button>
      </div>
    </div>

    <div id="howto" class="howto hidden">
      <svg viewBox="0 0 200 80" width="150" height="60" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 40 C 34 14, 66 14, 86 40 C 66 66, 34 66, 14 40 Z"/><circle cx="50" cy="40" r="10" fill="#fff"/>
        <path d="M114 44 C 134 66, 166 66, 186 44"/><path d="M126 52 l-6 9 M150 58 l0 11 M174 52 l6 9"/>
      </svg>
      <b>Wink to sweep them off their feet</b>
      <span>Left eye for the left lane, right eye for the right.</span>
      <em id="howtoCta">Wink to start</em>
    </div>
    <div id="countdown" class="countdown hidden"></div>

    <div id="resultPanel" class="resultlite hidden">
      <div class="rhead">
        <b><span id="rPct">0%</span></b>
        <span id="rLine">swept off their feet</span>
        <em id="resultTitle">Irresistible.</em>
      </div>
      <div class="rbtns hidden" id="rbtns">
        <button id="replay" class="replay" aria-label="Play again"><svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path d="M34 6v9h-9"/></svg></button>
        <button id="home" class="link">Back</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./app.mjs?v=30"></script>
</body>
</html>
